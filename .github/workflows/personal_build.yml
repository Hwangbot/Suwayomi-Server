name: Personal build

# Builds this fork on every push to master and publishes a GitHub Release
# with the server jar and ready-to-run macOS and Windows bundles.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: master
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp master/.github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build WebUI and Jar
        env:
          ProductBuildType: "Preview"
        working-directory: master
        run: ./gradlew :server:downloadWebUI :server:shadowJar --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: master/server/build/*.jar
          if-no-files-found: error

      - name: Upload icons
        uses: actions/upload-artifact@v7
        with:
          name: icon
          path: master/server/src/main/resources/icon
          if-no-files-found: error

      - name: Tar scripts dir to maintain file permissions
        run: tar -czf scripts.tar.gz -C master/ scripts/

      - name: Upload scripts.tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: scripts
          path: scripts.tar.gz
          if-no-files-found: error

  jlink:
    name: Package ${{ matrix.name }} JRE
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
          - os: windows-latest
            name: windows-x64
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Package JDK
        run: jlink --add-modules java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.naming,java.prefs,java.scripting,java.se,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.attach,jdk.crypto.ec,jdk.jdi,jdk.management,jdk.net,jdk.unsupported,jdk.unsupported.desktop,jdk.zipfs,jdk.accessibility --output suwa --strip-debug --no-man-pages --no-header-files --compress=2

      - name: Upload JRE package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-jre
          path: suwa

  bundle:
    name: Make ${{ matrix.name }} bundle
    needs: [build, jlink]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [macOS-arm64, macOS-x64, windows-x64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: server/build
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.name }}-jre
          path: jre
      - uses: actions/download-artifact@v8
        with:
          name: icon
          path: server/src/main/resources/icon
      - uses: actions/download-artifact@v8
        with:
          name: scripts

      - name: Make ${{ matrix.name }} bundle
        run: |
          mkdir upload
          tar -xpf scripts.tar.gz
          scripts/bundler.sh -o upload/ ${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: '{macOS-arm64,macOS-x64,windows-x64}'
          merge-multiple: true
          path: release

      - name: Generate tag name
        id: tag
        run: |
          version=$(cd release && ls *.jar | sed -e 's/Suwayomi-Server-\|.jar//g')
          echo "value=personal-${version}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/*
